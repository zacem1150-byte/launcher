name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          mkdir proj
          unzip -q project-1.zip -d proj
          unzip -q -o project-2.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Fix libtinfo
        run: |
          sudo apt-get update
          sudo apt-get install -y libtinfo5 libncurses5 || true
          if [ ! -e /lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi
      - name: Install NDK r17c
        run: |
          curl -sSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r17c-linux-x86_64.zip
          unzip -q ndk.zip -d "$HOME"
          echo "NDK=$HOME/android-ndk-r17c" >> "$GITHUB_ENV"
      - name: Build libsamp.so
        working-directory: proj/Jni source
        run: |
          "$NDK/ndk-build" -j4
          ls -la libs/armeabi-v7a
      - name: Replace libsamp.so
        run: cp "proj/Jni source/libs/armeabi-v7a/libsamp.so" proj/app/src/main/jniLibs/armeabi-v7a/libsamp.so
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;30.0.1"
      - name: Fix repositories
        working-directory: proj
        run: |
          sed -i "s#jcenter()#mavenCentral()\n        maven { url 'https://maven.aliyun.com/repository/jcenter' }\n        maven { url 'https://maven.aliyun.com/repository/public' }#g" build.gradle
          cat build.gradle
      - name: Build APK
        working-directory: proj
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BlackRussia-APK
          path: proj/app/build/outputs/apk/debug/*.apk
